# 构建 dind 镜像并发布到 GitHub Container Registry (GHCR)
# 参考官方教程：https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
#
# 触发条件：仅 tag push（v* 格式，如 v1.0.0）
#
# 镜像位置：ghcr.io/xfl12345/dind
# 默认多架构：linux/amd64 + linux/arm64
# 附加构建上下文（build-contexts）与本地 docker-compose.yaml 保持一致，确保
# Ubuntu-quick、LSIO openssh-server 这两个外部 git context 的 commit hash 固定、可复现

name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一 tag 新构建抢占旧的
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository 形如 "xfl12345/dind"，GHCR 镜像名直接用即可（GHCR 强制 lowercase）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-native:
    name: Build and Push Image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: amd64  # 用于 Docker tag
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 官方原生 ARM64
            tag_suffix: arm64  # 用于 Docker tag

    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # attestations/id-token 用于 actions/attest 生成 OCI 制品签名证明，
      # 拉取方可通过 gh attestation verify 校验镜像来源
      id-token: write
      attestations: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # # 多架构 build 准备：QEMU 模拟 arm64，buildx 编排
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/setup-compose-action
      - name: Set Up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.0
          cache-binary: true

      # https://github.com/docker/login-action
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # github.actor: 触发当前 workflow 的用户
          username: ${{ github.actor }}
          # GITHUB_TOKEN 自动签发，权限由上方 permissions.packages: write 决定
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # 将动态变量注入到环境中，供 docker-compose.ci.yaml 读取
        env:
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml build --push

      - name: Get image digest
        id: digest
        env:
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TAG_SUFFIX}" --format '{{.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # https://github.com/actions/attest
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  merge-manifest:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # https://github.com/docker/login-action
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 是确定性的，相同输入 → 相同输出，
      # 所以在 merge-manifest 里重新跑一遍即可拿到所有 tag
      # https://github.com/docker/metadata-action#typesha
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-

      # 将两个单架构镜像合并为一个多架构 manifest，并打上所有 tag
      - name: Create multi-arch manifest
        run: |
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $TAG_ARGS \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64
