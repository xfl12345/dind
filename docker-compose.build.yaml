services:
  dind:
    image: "${REGISTRY}/${IMAGE_NAME}:${TAG_SUFFIX}"
    container_name: dind
    pull_policy: build
    build:
      context: ./build_resource
      dockerfile: ./Dockerfile
      additional_contexts:
        ubuntu-quick: https://github.com/xfl12345/ubuntu-quick.git#04ec5c4033a920cb78c89d948366687fdab89234
        openssh-server: https://github.com/linuxserver/docker-openssh-server.git#879130ad04f326a039c173bf40b852a0f7e4485d
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
      args:
        # 开启 BuildKit 内联缓存，对后续拉取镜像加速很有用
        - BUILDKIT_INLINE_CACHE=1 
